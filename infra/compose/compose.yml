name: lrd
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["media-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file: ../../.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped
  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      BACKEND_URL: http://api:8080
      SITE_URL: ${SITE_URL:-http://localhost:8088}
      AUTH_PUBLIC_KEY: ${LRD_AUTH_PUBLIC_KEY}
      SESSION_COOKIE: ${SESSION_COOKIE:-LRD_SESSION}
    depends_on: [api]
    restart: unless-stopped
  ingress:
    profiles: ["app"]
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
