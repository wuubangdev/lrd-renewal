server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
spring:
  application:
    name: lrd-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/lrd}
    username: ${DB_USERNAME:lrd}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
      table-name: identity.spring_session
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
lrd:
  auth:
    private-key: ${LRD_AUTH_PRIVATE_KEY}
    public-key: ${LRD_AUTH_PUBLIC_KEY}
    cookie-secure: ${LRD_COOKIE_SECURE:false}
    allowed-origins: ${LRD_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap:
    email: ${LRD_ADMIN_EMAIL:}
    password: ${LRD_ADMIN_PASSWORD:}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:59000}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET:lrd-media}
